<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>VVZ'49 — Grote Clubactie poster</title>
<style>
  @font-face {
    font-family: "Archivo Black";
    src: url("../assets/fonts/ArchivoBlack-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "Archivo";
    src: url("../assets/fonts/Archivo-Variable.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
  }

  :root {
    --vvz-groen: #35A044;
    --groen-donker: #2C8639;
    --groen-licht: #3FB84F;
    --navy: #0B2A52;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 2481px;
    height: 3508px;
    font-family: "Archivo", sans-serif;
    overflow: hidden;
  }

  /* Print: exact A3-pagina (297x420mm), canvas geschaald zodat het precies past —
     alleen actief bij het genereren van de PDF via chromium --print-to-pdf. */
  @page { size: 297mm 420mm; margin: 0; }
  @media print {
    html, body { width: 297mm; height: 420mm; }
    .poster { transform: scale(0.45245); transform-origin: top left; }
  }

  /* A3-poster, canvas 2481x3508px (~212dpi) zodat de screenshot-PNG scherp print. */
  .poster {
    position: relative;
    width: 2481px;
    height: 3508px;
    color: #fff;
    overflow: hidden;
  }

  /* ACHTERGROND — close-up foto van grasmat met een witte veldlijn, zodat meteen
     duidelijk is dat dit een voetbalveld is (full-bleed, met donkere overlay voor
     leesbare tekst erbovenop). */
  .gras {
    position: absolute;
    inset: 0;
    background-image: url("../assets/achtergronden/voetbalveld-lijn.jpg");
    background-size: cover;
    background-position: 65% 50%;
  }
  .schaduw {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(
      180deg,
      rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 16%,
      rgba(0,0,0,0.15) 66%, rgba(0,0,0,0.60) 100%
    );
  }

  /* KICKER — linksboven */
  .kicker {
    position: absolute;
    top: 110px;
    left: 120px;
    right: 640px;
    font-family: "Archivo Black", sans-serif;
    font-size: 62px;
    line-height: 1.15;
    text-transform: uppercase;
    text-shadow: 0 3px 10px rgba(0,0,0,0.45);
  }

  /* VVZ'49 LOGO — rechtsboven, op wit rondje */
  .logo-badge {
    position: absolute;
    top: 70px;
    right: 100px;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  .logo-badge img {
    width: 330px;
    height: 330px;
    object-fit: contain;
  }

  /* GROTE CLUBACTIE — logo-badge, prominent, wit paneel met het officiële GCA-logo */
  .gca-badge {
    position: absolute;
    top: 560px;
    left: 50%;
    transform: translateX(-50%);
    width: 1120px;
    background: #fff;
    border-radius: 28px;
    padding: 46px 70px 40px;
    text-align: center;
    box-shadow: 0 8px 28px rgba(0,0,0,0.35);
  }
  .gca-badge img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* GROTE KOP — navy banner zodat de tekst goed leesbaar blijft op de grasmat */
  .headline-banner {
    position: absolute;
    left: 120px;
    right: 120px;
    top: 1260px;
    background: var(--navy);
    border-radius: 24px;
    padding: 56px 70px;
    text-align: center;
    box-shadow: 0 8px 28px rgba(0,0,0,0.35);
  }
  .headline-banner .headline {
    margin: 0;
    font-family: "Archivo Black", sans-serif;
    font-size: 116px;
    line-height: 1.05;
    text-transform: uppercase;
    letter-spacing: -1px;
  }
  .headline-banner .accent { color: var(--groen-licht); }

  /* MIDDENCIRKEL-ZONE — ruimte om de veldlijnen te laten "ademen" tussen kop en loten */

  /* LOTEN — twee witte kaarten met QR-code, elk duidelijk gelabeld met het lot-type */
  .loten {
    position: absolute;
    left: 120px;
    right: 120px;
    top: 2180px;
    display: flex;
    justify-content: space-between;
    gap: 60px;
  }
  .lot-kaart {
    flex: 1;
    background: #fff;
    border-radius: 28px;
    padding: 48px 40px 44px;
    text-align: center;
    box-shadow: 0 8px 28px rgba(0,0,0,0.35);
  }
  .lot-kaart .lot-naam {
    font-family: "Archivo Black", sans-serif;
    font-size: 68px;
    color: var(--navy);
    text-transform: uppercase;
    margin: 0 0 30px 0;
  }
  .lot-kaart img.qr {
    width: 460px;
    height: 460px;
    display: block;
    margin: 0 auto;
  }
  .lot-kaart .lot-uitleg {
    margin-top: 28px;
    font-family: "Archivo Black", sans-serif;
    font-size: 32px;
    color: var(--navy);
    text-transform: uppercase;
  }

  /* INFOBOX — groen vlak onderaan met oproep-tot-actie */
  .infobox {
    position: absolute;
    left: 120px;
    right: 120px;
    bottom: 120px;
    background: var(--vvz-groen);
    border-radius: 24px;
    padding: 56px 70px;
    text-align: center;
    box-shadow: 0 8px 28px rgba(0,0,0,0.35);
  }
  .infobox p {
    margin: 0 0 16px 0;
    font-family: "Archivo Black", sans-serif;
    font-size: 58px;
    line-height: 1.25;
    text-transform: uppercase;
  }
  .infobox .locatie { color: var(--navy); }
  .infobox hr {
    border: none;
    border-top: 4px solid rgba(255,255,255,0.7);
    margin: 30px auto;
    width: 55%;
  }
  .infobox .cta {
    margin-bottom: 0;
    font-size: 46px;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="gras"></div>
    <div class="schaduw"></div>

    <div class="kicker">
      STEUN<br>
      VVZ&rsquo;49!
    </div>

    <div class="logo-badge">
      <img src="../assets/logos/vvz49.png" alt="VVZ'49 logo">
    </div>

    <div class="gca-badge">
      <img src="../assets/logos/gca-logo.svg" alt="Grote Clubactie logo">
    </div>

    <div class="headline-banner">
      <p class="headline">
        KOOP HIER<br>
        JE LOTEN VOOR DE<br>
        <span class="accent">GROTE CLUB ACTIE</span>
      </p>
    </div>

    <div class="loten">
      <div class="lot-kaart">
        <p class="lot-naam">LOSSE LOTEN</p>
        <img class="qr" src="../assets/qr/qr-los-lot.png" alt="QR-code losse loten">
        <p class="lot-uitleg">Scan &amp; koop een lot</p>
      </div>
      <div class="lot-kaart">
        <p class="lot-naam">SUPERLOTEN</p>
        <img class="qr" src="../assets/qr/qr-superlot.png" alt="QR-code superloten">
        <p class="lot-uitleg">Scan &amp; koop een superlot</p>
      </div>
    </div>

    <div class="infobox">
      <p>Elk lot steunt VVZ&rsquo;49</p>
      <hr>
      <p class="cta">De opbrengst gaat naar een interactieve voetbalmuur</p>
    </div>
  </div>
</body>
</html>
